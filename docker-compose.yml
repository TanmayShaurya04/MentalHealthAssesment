services:
  serenova:
    build:
      context: .
      dockerfile: Dockerfile
    image: serenova:latest
    container_name: serenova-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    # All secrets come from a .env file next to this one (copy .env.example). Nothing sensitive is stored in this file.
    env_file:
      - .env
    environment:
      - PORT=8000
    volumes:
      - serenova-data:/app/data

volumes:
  serenova-data:
