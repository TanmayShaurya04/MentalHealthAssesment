services:
  serenova:
    build:
      context: .
      dockerfile: Dockerfile
    image: serenova:latest
    container_name: serenova-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - JWT_SECRET=serenova-production-secure-key-32chars
      # - MONGODB_URL=mongodb+srv://... (optional: falls back to file-backed storage if omitted)
      # - AI_API_KEY=gsk_... (optional: falls back to rich rule-based engine if omitted)
    volumes:
      - serenova-data:/app/data

volumes:
  serenova-data:
